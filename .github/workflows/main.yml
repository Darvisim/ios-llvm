name: iOS LLVM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.type }})

    strategy:
      matrix:
        type:
          - Release
          - Debug
        target:
          - ios-arm64
          - ios-simulator-arm64
          - ios-simulator-x86_64

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          chmod +x build-native.sh
          ./build-native.sh "${{ matrix.target }}" "${{ matrix.type }}"
